<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5f2" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html, body, #app { min-height: 100%; background: #f7f5f2; }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #app { background: #1a1916; color-scheme: dark; }
    </style>
    <script>
      try { const value = localStorage.getItem("shiye:theme"); document.documentElement.dataset.theme = value === "dark" || value !== "light" && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch {}
    </script>
    <script>
      (() => {
        const key = 'shiye:asset-recovery';
        const recover = () => {
          const last = Number(sessionStorage.getItem(key) || 0);
          if (Date.now() - last < 30000) return;
          sessionStorage.setItem(key, String(Date.now()));
          window.location.reload();
        };
        window.addEventListener('error', (event) => {
          const target = event.target;
          const source = target && ('src' in target ? target.src : 'href' in target ? target.href : '');
          if (source && /\/assets\//.test(source)) recover();
        }, true);
      })();
    </script>
    <title>十夜管理后台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
