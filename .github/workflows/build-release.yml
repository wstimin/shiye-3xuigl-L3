name: Build release package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Delete previous build outputs
        run: npm run build:clean

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Type-check source
        run: npm run typecheck

      - name: Delete type-check build outputs
        run: npm run build:clean

      - name: Build all runtime files from scratch
        run: npm run build

      - name: Verify deployment build
        run: npm run deploy:check

      - name: Stage prebuilt runtime package
        run: npm run release:stage

      - name: Verify staged deployment package
        working-directory: .release/package
        run: npm run deploy:check

      - name: Create ZIP without a wrapper directory
        working-directory: .release/package
        run: zip -qr ../../shiye-3xuigl.zip .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiye-3xuigl-${{ github.ref_name }}
          path: shiye-3xuigl.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" shiye-3xuigl.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" shiye-3xuigl.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
