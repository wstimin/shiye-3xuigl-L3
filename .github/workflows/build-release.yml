name: Build release package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Delete previous build outputs
        run: npm run build:clean

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run critical logic tests
        run: npm test

      - name: Test panel maintenance in an unprivileged Node container
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD:/workspace" -w /workspace node:20-bookworm-slim
          node --import tsx --test tests/panel-maintenance.test.ts tests/web-assets.test.ts

      - name: Type-check source
        run: npm run typecheck

      - name: Delete type-check build outputs
        run: npm run build:clean

      - name: Build all runtime files from scratch
        env:
          SHIYE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Verify deployment build
        run: npm run deploy:check

      - name: Stage prebuilt runtime package
        run: npm run release:stage

      - name: Verify staged deployment package
        working-directory: .release/package
        run: npm run deploy:check

      - name: Create ZIP without a wrapper directory
        working-directory: .release/package
        run: zip -qr ../../shiye-3xuigl.zip .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiye-3xuigl-${{ github.ref_name }}
          path: shiye-3xuigl.zip
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "GitHub request failed; retrying in $((attempt * 5)) seconds." >&2
                sleep "$((attempt * 5))"
              fi
            done
            return 1
          }
          remote_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [[ -n "$remote_sha" && "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag $RELEASE_TAG already points to $remote_sha, not $GITHUB_SHA." >&2
            echo "Bump package.json before publishing another release." >&2
            exit 1
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v tag="$RELEASE_TAG" '
            /^## / { if (found) exit; if ($2 == tag) found = 1 }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then printf '%s\n' "$RELEASE_TAG" > "$notes_file"; fi
          ensure_draft() {
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then return 0; fi
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --notes-file "$notes_file" --draft
          }
          retry ensure_draft
          retry gh release upload "$RELEASE_TAG" shiye-3xuigl.zip --clobber
          retry gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" \
            --notes-file "$notes_file" --draft=false --latest
